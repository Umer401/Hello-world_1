name: Java CI

# 1. Trigger workflow on push
on: [push]

jobs:
  job-name:
    # 2. Use Ubuntu runner
    runs-on: ubuntu-latest

    # 3. (Optional) Use Jenkinsfile Runner container
    container:
      image: ghcr.io/jenkinsci/jenkinsfile-runner:master

    steps:
      # 5. Checkout your source code into the runner
      - name: Checkout repository
        uses: actions/checkout@v2

      # 6. Run Jenkinsfile Runner action
      - name: Run Jenkinsfile Runner
        uses: jenkinsci/jfr-container-action@v1
        with:
          jenkinsfile: Jenkinsfile
